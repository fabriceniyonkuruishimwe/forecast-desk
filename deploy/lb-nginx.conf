upstream forecast_backend {
    server 3.9.170.8:80 max_fails=3 fail_timeout=15s;
    server 18.134.244.108:80 max_fails=3 fail_timeout=15s;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://forecast_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Load-Balancer $hostname always;
    }
}
